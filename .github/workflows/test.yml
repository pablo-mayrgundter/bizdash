# Unit, parity and browser tests. The browser tests drive Chromium against the
# synthetic Data API: no credentials and no network.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest
