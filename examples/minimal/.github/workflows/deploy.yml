# Deploys this repository's dashboard to GitHub Pages on every push to main.
# The dashboard is bizdash at a pinned release with site/ laid over it.
#
# One-time setup: Settings -> Pages -> Source: "Deploy from a branch",
# branch gh-pages, folder / (the first run creates the branch).
name: Deploy dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages-deploy
  cancel-in-progress: false
jobs:
  deploy:
    uses: pablo-mayrgundter/bizdash/.github/workflows/deploy.yml@v0.1.0
    with:
      version: v0.1.0          # keep in step with the @ref above
      site-dir: site
