[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bizdash"
version = "0.1.1"
description = "A reusable Google Analytics 4 bizdev dashboard: static SPA, caching proxy, snapshots."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "flask>=3.0",
  "google-auth>=2.30",
  "requests>=2.31",
]

[project.optional-dependencies]
snapshot = ["duckdb>=1.0"]
dev = ["pytest>=8.0", "playwright>=1.44", "duckdb>=1.0"]

[project.scripts]
bizdash = "bizdash.cli:main"

[project.urls]
Homepage = "https://github.com/pablo-mayrgundter/bizdash"

[tool.setuptools]
packages = ["bizdash"]
include-package-data = true

[tool.setuptools.package-data]
bizdash = ["web/*", "web/*/*", "web/*/*/*", "web/*/*/*/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q --strict-markers"
markers = ["browser: drives the dashboard in Chromium", "slow: builds and installs the package"]
